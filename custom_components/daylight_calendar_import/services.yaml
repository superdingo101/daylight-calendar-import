parse_text:
  name: Parse text
  description: Extract validated calendar event drafts without creating events.
  fields:
    text:
      name: Text
      description: Unstructured text containing zero or more calendar events.
      required: true
      selector:
        text:
          multiline: true

import_text:
  name: Import text
  description: Extract validated event drafts and create them on the configured calendar.
  fields:
    text:
      name: Text
      description: Unstructured text containing zero or more calendar events.
      required: true
      selector:
        text:
          multiline: true

submit_text:
  name: Submit text for review
  description: Extract validated event drafts, deduplicate them, and store new events for later approval or rejection.
  fields:
    text:
      name: Text
      description: Unstructured text containing zero or more calendar events.
      required: true
      selector:
        text:
          multiline: true
    source_id:
      name: Source ID
      description: Optional stable upstream identifier used to skip a source that is already pending or handled.
      required: false
      selector:
        text:

submit_image:
  name: Submit image for review
  description: Upload an image, extract event drafts with an attachment-capable AI Task entity, and queue them for review. The uploaded file and temporary media copy are removed after processing.
  fields:
    file_id:
      name: Image upload
      description: PNG, JPEG, or WebP image (10 MiB maximum).
      required: true
      selector:
        file:
          accept: image/png,image/jpeg,image/webp
    text:
      name: Text
      description: Optional context to interpret together with the image.
      selector:
        text:
          multiline: true
    source_id:
      name: Source ID
      description: Optional stable upstream identifier for deduplication.
      selector:
        text:

submit_pdf:
  name: Submit PDF for review
  description: Extract PDF text locally when available; otherwise pass the PDF to an attachment-capable AI Task entity. Uploaded files and temporary media copies are removed after processing.
  fields:
    file_id:
      name: PDF upload
      description: PDF file (10 MiB maximum, 30 pages maximum).
      required: true
      selector:
        file:
          accept: application/pdf
    text:
      name: Text
      description: Optional context used together with the PDF.
      selector:
        text:
          multiline: true
    source_id:
      name: Source ID
      description: Optional stable upstream identifier for deduplication.
      selector:
        text:

approve_pending:
  name: Approve pending import
  description: Create all events from a pending import on the configured calendar, then remove it from review.
  fields:
    pending_id:
      name: Pending import ID
      description: Stable ID returned when the pending import was created.
      required: true
      selector:
        text:

reject_pending:
  name: Reject pending import
  description: Remove a pending import without creating calendar events. Resolve uncertain writes first.
  fields:
    pending_id:
      name: Pending import ID
      description: Stable ID returned when the pending import was created.
      required: true
      selector:
        text:

list_pending:
  name: List pending imports
  description: Return a summary of pending imports without their source text. Requires control of the configured AI Task and calendar entities.

get_pending:
  name: Get pending import
  description: Return the source text and event drafts for a pending import. Requires control of the configured AI Task and calendar entities.
  fields:
    pending_id:
      name: Pending import ID
      description: Stable ID returned when the pending import was created.
      required: true
      selector:
        text:

get_pending_event:
  name: Get pending event
  description: Return one draft by its stable event ID. Requires control of the configured AI Task and calendar entities.
  fields:
    pending_id:
      name: Pending import ID
      description: Stable ID of the parent import.
      required: true
      selector:
        text:
    event_id:
      name: Pending event ID
      description: Stable ID of an event within the import.
      required: true
      selector:
        text:

edit_pending_event:
  name: Edit pending event
  description: Replace a pending draft or select its allowed destination calendar while keeping its event ID. An uncertain calendar write must be resolved before editing.
  fields:
    pending_id:
      name: Pending import ID
      required: true
      selector:
        text:
    event_id:
      name: Pending event ID
      required: true
      selector:
        text:
    event:
      name: Replacement event
      description: Complete draft with title, ISO start/end, all_day, and optional location, description, and confidence.
      required: true
      selector:
        object:
    calendar_entity:
      name: Destination calendar
      description: Optional writable calendar from the integration's allowed calendars.
      selector:
        entity:
          domain: calendar

reject_pending_event:
  name: Reject pending event
  description: Reject one event while keeping other events in the pending import. An uncertain calendar write must be resolved separately.
  fields:
    pending_id:
      name: Pending import ID
      required: true
      selector:
        text:
    event_id:
      name: Pending event ID
      required: true
      selector:
        text:

approve_pending_event:
  name: Approve pending event
  description: Create one event on the configured calendar using durable checkpoints, leaving sibling events for review.
  fields:
    pending_id:
      name: Pending import ID
      required: true
      selector:
        text:
    event_id:
      name: Pending event ID
      required: true
      selector:
        text:

resolve_pending_event:
  name: Resolve uncertain calendar write
  description: After checking the calendar, confirm whether an uncertain event was created, was not created and may be retried, or should be discarded.
  fields:
    pending_id:
      name: Pending import ID
      required: true
      selector:
        text:
    event_id:
      name: Pending event ID
      required: true
      selector:
        text:
    resolution:
      name: Verified outcome
      required: true
      selector:
        select:
          options:
            - created
            - not_created
            - discard
