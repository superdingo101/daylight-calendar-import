parse_text:
  name: Parse text
  description: Extract validated calendar event drafts without creating events.
  fields:
    text:
      name: Text
      description: Unstructured text containing zero or more calendar events.
      required: true
      selector:
        text:
          multiline: true

import_text:
  name: Import text
  description: Extract validated event drafts and create them on the configured calendar.
  fields:
    text:
      name: Text
      description: Unstructured text containing zero or more calendar events.
      required: true
      selector:
        text:
          multiline: true

submit_text:
  name: Submit text for review
  description: Extract validated event drafts, deduplicate them, and store new events for later approval or rejection.
  fields:
    text:
      name: Text
      description: Unstructured text containing zero or more calendar events.
      required: true
      selector:
        text:
          multiline: true
    source_id:
      name: Source ID
      description: Optional stable upstream identifier used to skip a source that is already pending or handled.
      required: false
      selector:
        text:

approve_pending:
  name: Approve pending import
  description: Create all events from a pending import on the configured calendar, then remove it from review.
  fields:
    pending_id:
      name: Pending import ID
      description: Stable ID returned when the pending import was created.
      required: true
      selector:
        text:

reject_pending:
  name: Reject pending import
  description: Remove a pending import without creating calendar events.
  fields:
    pending_id:
      name: Pending import ID
      description: Stable ID returned when the pending import was created.
      required: true
      selector:
        text:
