name: Verify Mintlify release publication

on:
  pull_request:
    paths:
      - "scripts/publish_docs_live.py"
      - "tests/test_docs_publication.py"
      - ".github/workflows/publish-mintlify-docs.yml"
      - ".github/workflows/docs-publication-tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/publish_docs_live.py"
      - "tests/test_docs_publication.py"
      - ".github/workflows/publish-mintlify-docs.yml"
      - ".github/workflows/docs-publication-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-tests:
    name: Tagged docs publication regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Prove stable-only Git publication with disposable remotes
        run: python -m unittest discover -s tests -p 'test_docs_publication.py' -v
