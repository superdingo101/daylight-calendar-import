name: ONE-TIME mutation shard-1 parity (PR 280)

# This temporary workflow runs exactly when it is introduced into PR #280.
# Subsequent source/test commits do NOT retrigger it. After parity succeeds,
# archive the SHA-bound artifact and remove this file in a separate commit.
on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/mutation-parity-once.yml

permissions:
  contents: read

concurrency:
  group: mutation-parity-pr280
  cancel-in-progress: false

jobs:
  original-versus-split:
    if: ${{ github.event.pull_request.number == 280 && github.head_ref == 'ci/split-init-mutation-shard' }}
    name: Verify all original shard-1 outcomes against five subshards
    uses: ./.github/workflows/mutation-sharded.yml
    with:
      target_sha: ${{ github.event.pull_request.head.sha }}
      verify_legacy_split: true
      compare_unsharded: false
