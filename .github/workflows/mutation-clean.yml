name: Clean mutation validation

on:
  schedule:
    # 02:00 PDT / 01:00 PST. GitHub schedules are UTC and may be delayed.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Optional exact commit SHA to clean-test; defaults to the selected ref"
        required: false
        type: string
      release_tag:
        description: "Optional vX.Y.Z tag for a manual release revalidation"
        required: false
        type: string
      rehearsal:
        description: "Generate proof for a rehearsal without posting release statuses"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      target_sha:
        type: string
        required: true
      release_tag:
        type: string
        required: true

      rehearsal:
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  statuses: write
  issues: write

concurrency:
  # Do not cancel a release validation when a nightly run begins.
  group: clean-mutation-${{ inputs.rehearsal && format('rehearsal-{0}', github.run_id) || inputs.release_tag || 'nightly' }}
  cancel-in-progress: false

jobs:
  target:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Restrict manual release revalidation to main
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
        run: test "$GITHUB_REF_NAME" = main
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_sha || github.sha }}
      - id: target
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  comprehensive:
    needs: target
    permissions:
      contents: read
    uses: ./.github/workflows/mutation-sharded.yml
    with:
      target_sha: ${{ needs.target.outputs.sha }}
  clean:
    name: Clean mutation score
    if: always()
    needs: [target, comprehensive]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.target.outputs.sha || github.sha }}
      - name: Require complete comprehensive validation
        id: mutation
        env:
          TARGET_RESULT: ${{ needs.target.result }}
          FULL_RESULT: ${{ needs.comprehensive.result }}
        run: |
          test "$TARGET_RESULT" = success
          test "$FULL_RESULT" = success
      - name: Download comprehensive evidence and diagnostics
        id: download
        if: always() && needs.target.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: mutation-sharded-aggregate
      - name: Independently revalidate all clean evidence
        id: enforce
        run: |
          test "${{ steps.download.outcome }}" = success
          python3 -m scripts.mutation_shards reduce
          python3 scripts/check_mutation_score.py
      - name: Require complete survivor diagnostics
        id: export
        run: |
          test -f mutation-survivors.txt
          test -f mutation-survivor-names.txt
          test -f mutation-survivor-report.txt
      - name: Create release mutation proof
        if: ${{ inputs.release_tag != '' && success() }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python -m scripts.release_mutation_proof create-sharded "$RELEASE_TAG"

      - name: Upload release mutation proof
        id: proof
        if: ${{ inputs.release_tag != '' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-clean-${{ inputs.release_tag }}
          path: release-mutation-proof.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - name: Upload mutation diagnostics
        id: diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-results
          if-no-files-found: warn
          overwrite: true
          path: |
            mutants/mutmut-cicd-stats.json
            mutation-survivors.txt
            mutation-survivor-names.txt
            mutation-survivor-report.txt

      - name: Report release validation on candidate commit
        if: ${{ always() && inputs.release_tag != '' && !inputs.rehearsal }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ needs.target.outputs.sha || inputs.target_sha || github.sha }}
          PROOF_OUTCOME: ${{ steps.proof.outcome }}
          DIAGNOSTICS_OUTCOME: ${{ steps.diagnostics.outcome }}
          MUTATION_OUTCOME: ${{ steps.mutation.outcome }}
          ENFORCE_OUTCOME: ${{ steps.enforce.outcome }}
          EXPORT_OUTCOME: ${{ steps.export.outcome }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          state=failure
          if [[ "$MUTATION_OUTCOME" == success && "$ENFORCE_OUTCOME" == success && "$EXPORT_OUTCOME" == success && "$PROOF_OUTCOME" == success && "$DIAGNOSTICS_OUTCOME" == success ]]; then
            state=success
          fi
          # The token-created release-prep PR does not fire the normal
          # pull_request mutation job. One clean run supplies both its release
          # gate and the standard required mutation context.
          for context in "Release Mutation Validation" "Mutation score"; do
            gh api --method POST "repos/${{ github.repository }}/statuses/$TARGET" \
              -f state="$state" \
              -f context="$context" \
              -f description="Clean mutation validation for $RELEASE_TAG" \
              -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          done

  nightly-report:
    name: Report nightly mutation health
    # A timed-out clean job cannot execute its own final reporting step.
    if: ${{ always() && github.event_name == 'schedule' }}
    needs: clean
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Download mutation diagnostics when available
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: mutation-results

      - name: Update visible nightly mutation health
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_CLEAN_OUTCOME: ${{ needs.clean.result }}
        run: python scripts/report_nightly_mutation.py
