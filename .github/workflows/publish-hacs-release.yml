name: 2 Publish HACS Release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  copilot-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Require main branch dispatch
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "ERROR: Run this workflow from the main branch."
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Read and verify integration version
        id: version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/daylight_calendar_import/manifest.json").read_text()
          )
          manifest_version = manifest.get("version", "")

          pyproject = Path("pyproject.toml").read_text()
          match = re.search(r'(?m)^version\s*=\s*"([^"]+)"\s*$', pyproject)
          pyproject_version = match.group(1) if match else ""

          if not manifest_version or manifest_version != pyproject_version:
              raise SystemExit(
                  "ERROR: manifest.json and pyproject.toml versions must exist and match"
              )

          tag = f"v{manifest_version}"
          if not re.fullmatch(
              r"v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?",
              tag,
          ):
              raise SystemExit("ERROR: Version must look like v1.2.3 or v1.2.3-beta0")

          print(f"version={manifest_version}")
          print(f"tag={tag}")
          PY

      - name: Verify tag does not already exist
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "ERROR: Tag $TAG already exists"
            exit 1
          fi

      # The release-preparation workflow must have tested the same complete
      # Git tree with an uncached mutmut run. Stale PR and nightly checks do
      # not authorize publishing a release.
      - name: Verify full release mutation validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_mutation_proof.py verify "${{ steps.version.outputs.tag }}"

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          comment: false

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

      - name: Install Copilot CLI
        id: install_copilot
        continue-on-error: true
        run: npm install -g @github/copilot

      - name: Generate GitHub release notes
        id: generated_notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          RELEASE_SHA="$(git rev-parse HEAD)"

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f target_commitish="$RELEASE_SHA" \
            > generated-release-notes.json

          jq -r '.name' generated-release-notes.json > release-title.txt
          jq -r '.body' generated-release-notes.json > generated-release-notes.md

      - name: Prepare Daylight draft notes and Copilot prompt
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          python -m scripts.release_notes prepare \
            --tag "$TAG" \
            --generated generated-release-notes.md \
            --notes RELEASE_NOTES.md \
            --prompt ai-release-prompt.md

      - name: Polish release notes with Copilot
        id: copilot_notes
        if: steps.install_copilot.outcome == 'success'
        continue-on-error: true
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          copilot \
            -p "$(cat ai-release-prompt.md)" \
            -s \
            --no-ask-user \
            > RELEASE_NOTES.ai.md

          if [ ! -s RELEASE_NOTES.ai.md ]; then
            echo "Copilot returned an empty response"
            exit 1
          fi

      - name: Select and validate Daylight draft notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ "${{ steps.copilot_notes.outcome }}" = "success" ]; then
            python -m scripts.release_notes select \
              --tag "$TAG" \
              --generated generated-release-notes.md \
              --notes RELEASE_NOTES.md \
              --candidate RELEASE_NOTES.ai.md
          else
            echo "Copilot unavailable; using Daylight-style GitHub-notes fallback."
          fi

          python -m scripts.release_notes validate \
            --tag "$TAG" \
            --generated generated-release-notes.md \
            --notes RELEASE_NOTES.md

          {
            echo "### Draft Daylight release notes"
            echo "Copilot outcome: ${{ steps.copilot_notes.outcome }}"
            echo "Review draft facts and release notes before publishing."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run release-note formatting regression tests
        run: python -m unittest discover -s tests -p 'test_release_notes.py' -v

      - name: Run release packaging regression tests
        run: python -m unittest discover -s tests -p 'test_hacs_release_package.py' -v

      - name: Build and validate HACS integration release ZIP
        run: |
          python -m scripts.build_hacs_release \
            --version "${{ steps.version.outputs.version }}" \
            --output daylight-calendar-import.zip

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          RELEASE_SHA="$(git rev-parse HEAD)"
          TITLE="$(cat release-title.txt)"

          PRERELEASE_ARGS=()
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi

          gh release create "$TAG" \
            daylight-calendar-import.zip \
            --target "$RELEASE_SHA" \
            --title "$TITLE" \
            --notes-file RELEASE_NOTES.md \
            --draft \
            "${PRERELEASE_ARGS[@]}"
