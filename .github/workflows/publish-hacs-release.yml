name: Publish HACS Release

on:
  workflow_dispatch:

permissions:
  contents: write
  copilot-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Require main branch dispatch
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "ERROR: Run this workflow from the main branch."
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Read and verify integration version
        id: version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/daylight_calendar_import/manifest.json").read_text()
          )
          manifest_version = manifest.get("version", "")

          pyproject = Path("pyproject.toml").read_text()
          match = re.search(r'(?m)^version\s*=\s*"([^"]+)"\s*$', pyproject)
          pyproject_version = match.group(1) if match else ""

          if not manifest_version or manifest_version != pyproject_version:
              raise SystemExit(
                  "ERROR: manifest.json and pyproject.toml versions must exist and match"
              )

          tag = f"v{manifest_version}"
          if not re.fullmatch(
              r"v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?",
              tag,
          ):
              raise SystemExit("ERROR: Version must look like v1.2.3 or v1.2.3-beta0")

          print(f"version={manifest_version}")
          print(f"tag={tag}")
          PY

      - name: Verify tag does not already exist
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "ERROR: Tag $TAG already exists"
            exit 1
          fi

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          comment: false

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

      - name: Install Copilot CLI
        id: install_copilot
        continue-on-error: true
        run: npm install -g @github/copilot

      - name: Generate GitHub release notes
        id: generated_notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f target_commitish="main" \
            > generated-release-notes.json

          jq -r '.name' generated-release-notes.json > release-title.txt
          jq -r '.body' generated-release-notes.json > generated-release-notes.md

      - name: Build AI release-notes prompt
        run: |
          cat > ai-release-prompt.md <<'EOF_PROMPT'
          Rewrite the following GitHub generated release notes for a Home Assistant HACS custom integration called Daylight Calendar Import.

          Requirements:
          - Keep it accurate. Do not invent features, bug fixes, breaking changes, migration steps, or links.
          - Preserve PR numbers, contributor mentions, Home Assistant entity/service names, and important configuration keys.
          - Make it useful to Home Assistant and HACS users.
          - Call out breaking changes or migration notes only when the generated notes clearly imply them.
          - Use concise Markdown.
          - Prefer headings like:
            ## Highlights
            ## Fixes
            ## Maintenance
            ## Full changelog
          - If there are only a few changes, keep the notes short.
          - Do not include marketing fluff.
          - Do not mention that AI rewrote the notes.

          Generated release notes:
          EOF_PROMPT

          cat generated-release-notes.md >> ai-release-prompt.md

      - name: Start with generated release notes
        run: cp generated-release-notes.md RELEASE_NOTES.md

      - name: Polish release notes with Copilot
        id: copilot_notes
        if: steps.install_copilot.outcome == 'success'
        continue-on-error: true
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          copilot \
            -p "$(cat ai-release-prompt.md)" \
            -s \
            --no-ask-user \
            > RELEASE_NOTES.ai.md

          if [ ! -s RELEASE_NOTES.ai.md ]; then
            echo "Copilot returned an empty response"
            exit 1
          fi

          mv RELEASE_NOTES.ai.md RELEASE_NOTES.md

      - name: Report release-note source
        run: |
          if [ "${{ steps.copilot_notes.outcome }}" = "success" ]; then
            echo "Using Copilot-polished release notes."
          else
            echo "Copilot polishing unavailable or failed; using GitHub-generated release notes."
          fi

      - name: Finish release notes
        run: |
          echo "" >> RELEASE_NOTES.md
          echo "---" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "_Generated from GitHub release notes. Please verify before publishing this draft._" >> RELEASE_NOTES.md

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          TITLE="$(cat release-title.txt)"

          PRERELEASE_ARGS=()
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi

          gh release create "$TAG" \
            --target main \
            --title "$TITLE" \
            --notes-file RELEASE_NOTES.md \
            --draft \
            "${PRERELEASE_ARGS[@]}"
