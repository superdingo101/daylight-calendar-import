name: Public release isolation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-isolation:
    name: Public release isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Test the release isolation guard
        run: python -m unittest discover -s tests -p 'test_public_release_isolation.py' -v
      - name: Build and scan the actual HACS ZIP
        run: python -m scripts.check_public_release_isolation
