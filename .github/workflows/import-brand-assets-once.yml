name: Import existing Daylight brand assets (one-time PR setup)

on:
  push:
    branches:
      - docs/match-card-mobile-navigation-logo
    paths:
      - .github/workflows/import-brand-assets-once.yml

permissions:
  contents: write

jobs:
  copy-exact-card-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Import PR branch
        uses: actions/checkout@v4
        with:
          ref: docs/match-card-mobile-navigation-logo
          fetch-depth: 1

      - name: Checkout original Card assets
        uses: actions/checkout@v4
        with:
          repository: superdingo101/daylight-calendar-card
          ref: main
          path: source-card
          persist-credentials: false

      - name: Verify source blobs and commit exact assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object source-card/docs/images/976.png)" = "95a096d2ae92f3186664eb769791046a2c84f6fa"
          test "$(git hash-object source-card/docs/images/977.ico)" = "4bf273fea4d9596efbdc7bd9dbfece59dd859ba6"
          mkdir -p docs/images
          cp source-card/docs/images/976.png docs/images/976.png
          cp source-card/docs/images/977.ico docs/images/977.ico
          git add docs/images/976.png docs/images/977.ico
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: vendor identical Card logo and favicon'
            git push origin HEAD:docs/match-card-mobile-navigation-logo
          fi
