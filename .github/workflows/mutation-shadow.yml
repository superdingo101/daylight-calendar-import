name: Mutation scope shadow

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: mutation-shadow-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Proposed mutation scope (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements_test.txt
      - name: Compute shadow plan (never substitutes for Mutation score)
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python -m scripts.mutation_shadow --base "$PR_BASE" --head "$PR_HEAD"
      - name: Upload shadow plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-shadow-plan
          path: mutation-shadow-plan.json
          if-no-files-found: warn

  replay:
    # Temporary, non-gating validation of the draft planner against live PR heads.
    # Keep this isolated from the application PRs and remove before merging.
    name: Replay mutation scope PR #${{ matrix.target }}
    if: ${{ github.event.pull_request.number == 124 }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [121, 120, 123]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: planner
      - name: Resolve exact target PR refs
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_PR: ${{ matrix.target }}
        run: |
          response="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$TARGET_PR")"
          echo "head_sha=$(jq -r '.head.sha' <<< "$response")" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(jq -r '.base.sha' <<< "$response")" >> "$GITHUB_OUTPUT"
          echo "base_ref=$(jq -r '.base.ref' <<< "$response")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.target.outputs.head_sha }}
          path: target
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: target/requirements_test.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r target/requirements_test.txt
      - name: Execute planner from #124 on target PR checkout
        working-directory: target
        env:
          PR_BASE: ${{ steps.target.outputs.base_sha }}
          PR_HEAD: ${{ steps.target.outputs.head_sha }}
        run: |
          python "$GITHUB_WORKSPACE/planner/scripts/mutation_shadow.py" --base "$PR_BASE" --head "$PR_HEAD"
          cat mutation-shadow-plan.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-replay-pr-${{ matrix.target }}
          path: target/mutation-shadow-plan.json
          if-no-files-found: warn
