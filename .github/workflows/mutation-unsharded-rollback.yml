name: Unsharded mutation rollback (manual only)

on:
  workflow_dispatch:
    inputs:
      target_sha:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Do not cancel a release validation when a nightly run begins.
  group: mutation-rollback-${{ inputs.target_sha }}
  cancel-in-progress: false

jobs:
  clean:
    name: Clean mutation score
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements_test.txt

      - name: Discard all mutation state
        run: rm -rf mutants

      - name: Run full clean mutation tests
        id: mutation
        run: mutmut run

      - name: Enforce clean score
        id: enforce
        run: |
          mutmut export-cicd-stats
          python scripts/check_mutation_score.py

      - name: Export complete survivor diagnostics
        id: export
        if: always()
        run: python scripts/export_mutation_survivors.py

      - name: Upload mutation diagnostics
        id: diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-results
          if-no-files-found: warn
          overwrite: true
          path: |
            mutants/mutmut-cicd-stats.json
            mutation-survivors.txt
            mutation-survivor-names.txt
            mutation-survivor-report.txt

