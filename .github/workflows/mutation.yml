name: Incremental mutation testing

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: mutation-incremental-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mutation:
    name: Mutation score
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements_test.txt

      # PR caches are isolated by GitHub; a PR can also restore a cache from
      # main. Each save has a unique key because cache entries are immutable.
      - name: Restore mutation cache
        uses: actions/cache/restore@v4
        with:
          path: mutants
          key: mutmut-v2-linux-py314-v380-pr-${{ github.event.pull_request.number }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            mutmut-v2-linux-py314-v380-pr-${{ github.event.pull_request.number }}-
            mutmut-v2-linux-py314-v380-main-

      - name: Validate mutation cache provenance
        run: python scripts/mutation_cache.py validate

      - name: Run incremental mutations
        run: mutmut run

      - name: Enforce mutation baseline
        run: |
          mutmut export-cicd-stats
          python scripts/check_mutation_score.py

      - name: Export survivor diagnostics
        if: always()
        run: python scripts/export_mutation_survivors.py

      - name: Stamp reusable results
        run: python scripts/mutation_cache.py stamp

      - name: Save reusable mutation state
        uses: actions/cache/save@v4
        with:
          path: mutants
          key: mutmut-v2-linux-py314-v380-pr-${{ github.event.pull_request.number }}-${{ github.sha }}-${{ github.run_id }}

      - name: Upload mutation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-results
          if-no-files-found: warn
          path: |
            mutants/mutmut-cicd-stats.json
            mutation-survivors.txt
            mutation-survivor-names.txt
            mutation-survivor-report.txt
