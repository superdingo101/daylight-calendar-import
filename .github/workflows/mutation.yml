name: Incremental mutation testing
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: mutation-incremental-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  mutation:
    name: Mutation score
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements_test.txt
      - name: Select changed production modules
        id: scope
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python scripts/pr_mutation.py prepare --base "$PR_BASE" --head "$PR_HEAD"
      - name: Explain non-Python scope
        if: ${{ steps.scope.outputs.mode == 'skip' }}
        run: echo "No mutation-relevant Python code changed; mutation testing not applicable."
      # A PR ref can restore its own previous cache. Every run uses a unique
      # immutable save key; prefix restores choose the most recent candidate.
      - name: Restore prior PR mutation state
        if: ${{ steps.scope.outputs.mode == 'scoped' || steps.scope.outputs.mode == 'full' }}
        uses: actions/cache/restore@v4
        with:
          path: mutants
          key: pr-mutmut-v1-${{ runner.os }}-py314-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pr-mutmut-v1-${{ runner.os }}-py314-${{ github.event.pull_request.number }}-
      - name: Validate restored state and invalidate affected mutants
        if: ${{ steps.scope.outputs.mode == 'scoped' || steps.scope.outputs.mode == 'full' }}
        run: python scripts/pr_mutation_cache.py restore --pr "${{ github.event.pull_request.number }}"
      - name: Run mutations for changed modules
        id: mutate
        if: ${{ steps.scope.outputs.mode == 'scoped' || steps.scope.outputs.mode == 'full' }}
        run: mutmut run
      - name: Enforce scoped mutation quality
        if: ${{ (steps.scope.outputs.mode == 'scoped' || steps.scope.outputs.mode == 'full') }}
        run: |
          mutmut export-cicd-stats
          python scripts/check_mutation_score.py
      - name: Export mutation survivor diagnostics
        if: ${{ always() && (steps.scope.outputs.mode == 'scoped' || steps.scope.outputs.mode == 'full') }}
        run: python scripts/export_mutation_survivors.py
      # Even a low score must save completed mutant verdicts, so that the
      # next test-only commit can recheck survivors rather than all killed ones.
      - name: Stamp completed mutation state
        id: stamp
        if: ${{ !cancelled() && steps.mutate.outcome == 'success' }}
        run: python scripts/pr_mutation_cache.py stamp --pr "${{ github.event.pull_request.number }}"
      - name: Save reusable PR mutation state
        if: ${{ !cancelled() && steps.stamp.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: mutants
          key: pr-mutmut-v1-${{ runner.os }}-py314-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Restore mutation configuration
        if: always()
        run: python scripts/pr_mutation.py restore
      - name: Upload mutation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-results
          if-no-files-found: warn
          path: |
            .pr-mutation-scope.json
            mutants/mutmut-cicd-stats.json
            mutation-survivors.txt
            mutation-survivor-names.txt
            mutation-survivor-report.txt
