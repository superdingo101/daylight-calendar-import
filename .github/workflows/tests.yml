name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements_test.txt
      - run: pytest --cov --cov-branch --cov-fail-under=100

  mutation:
    name: Mutation score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements_test.txt
      - name: Run mutation tests
        run: mutmut run
      - name: Export and enforce mutation statistics
        run: |
          mutmut export-cicd-stats
          python scripts/check_mutation_score.py
      - name: Export surviving mutants
        if: always()
        run: |
          mutmut results > mutation-survivors.txt || true
          sed -n 's/^    \(.*\): survived$/\1/p' mutation-survivors.txt > mutation-survivor-names.txt
          : > mutation-survivor-report.txt
          while IFS= read -r mutant; do
            {
              echo "===== $mutant ====="
              mutmut show "$mutant"
              echo
            } >> mutation-survivor-report.txt
          done < mutation-survivor-names.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-results
          path: |
            mutants/mutmut-cicd-stats.json
            mutation-survivors.txt
            mutation-survivor-names.txt
            mutation-survivor-report.txt

  test-ha-2026-7:
    name: Test Home Assistant 2026.7.4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install Home Assistant 2026.7.4 test environment
        run: >-
          pip install
          "homeassistant==2026.7.4"
          "pytest>=8.0"
          "pytest-asyncio>=0.24"
          "pytest-cov>=6.0"
          "pytest-homeassistant-custom-component>=0.13.0"
          "hassil==3.8.0"
          "home-assistant-intents==2026.6.24"
          "PyTurboJPEG==1.8.3"
      - run: pytest --cov --cov-branch --cov-fail-under=100
