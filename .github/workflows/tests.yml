name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements_test.txt
      - run: pytest --cov --cov-branch --cov-fail-under=100

  mutation:
    name: Mutation baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements_test.txt
      - name: Run mutation tests
        run: mutmut run
      - name: Export mutation statistics
        run: |
          mutmut export-cicd-stats
          python - <<'PY'
          import json
          from pathlib import Path

          stats = json.loads(Path("mutants/mutmut-cicd-stats.json").read_text())
          tested = stats["total"] - stats["skipped"]
          score = 0.0 if tested <= 0 else (
              (stats["killed"] + stats["timeout"]) / tested * 100
          )
          summary = (
              f"## Mutation testing\n\n"
              f"- Score: **{score:.2f}%**\n"
              f"- Killed: {stats['killed']}\n"
              f"- Survived: {stats['survived']}\n"
              f"- No tests: {stats['no_tests']}\n"
              f"- Timeout: {stats['timeout']}\n"
              f"- Suspicious: {stats['suspicious']}\n"
              f"- Skipped: {stats['skipped']}\n"
              f"- Total: {stats['total']}\n"
          )
          print(summary)
          with open(Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]), "a") as f:
              f.write(summary)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mutation-stats
          path: mutants/mutmut-cicd-stats.json

  test-ha-2026-7:
    name: Test Home Assistant 2026.7.4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install Home Assistant 2026.7.4 test environment
        run: >-
          pip install
          "homeassistant==2026.7.4"
          "pytest>=8.0"
          "pytest-asyncio>=0.24"
          "pytest-cov>=6.0"
          "pytest-homeassistant-custom-component>=0.13.0"
          "hassil==3.8.0"
          "home-assistant-intents==2026.6.24"
          "PyTurboJPEG==1.8.3"
      - run: pytest --cov --cov-branch --cov-fail-under=100
