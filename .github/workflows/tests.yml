name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Review frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm test
        working-directory: custom_components/daylight_calendar_import/frontend

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements_test.txt
      - run: pytest --cov --cov-branch --cov-fail-under=100

  test-ha-2026-7:
    name: Test Home Assistant 2026.7.4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install Home Assistant 2026.7.4 test environment
        run: >-
          pip install
          "homeassistant==2026.7.4"
          "home-assistant-frontend==20260624.6"
          "pytest>=8.0"
          "pytest-asyncio>=0.24"
          "pytest-cov>=6.0"
          "pytest-homeassistant-custom-component>=0.13.0"
          "hypothesis>=6.168.1,<7"
          "hassil==3.8.0"
          "home-assistant-intents==2026.6.24"
          "PyTurboJPEG==1.8.3"
          "pypdf==6.14.2"
          "jsonschema>=4.23,<5"
          "referencing>=0.35,<1"
      - run: pytest --cov --cov-branch --cov-fail-under=100
