name: Validate Mintlify documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/mintlify-docs-validate.yml"
      - ".github/scripts/validate-doc-images.mjs"
  push:
    branches: [main, docs-live]
    paths:
      - "docs/**"
      - ".github/workflows/mintlify-docs-validate.yml"
      - ".github/scripts/validate-doc-images.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Mintlify site validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install Mintlify CLI
        run: npm install --global mint@latest
      - name: Validate docs.json and MDX
        working-directory: docs
        run: mint validate
      - name: Check documentation links
        working-directory: docs
        run: mint broken-links
      - name: Install MDX parsing dependencies
        run: npm install --no-save --no-package-lock --prefix .github/scripts unified@11 remark-parse@11 remark-mdx@3
      - name: Regression-check MDX image detection
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          mkdir -p "$root/images"
          cat > "$root/example.mdx" <<'MDX'
          <Step title="Screenshot">
            ![actual](/images/actual.png)
            ![reference][shot]

            [shot]: /images/actual.png
          </Step>

          `![literal](/images/literal-does-not-exist.png)`

          ```md
          ![fenced](/images/fenced-does-not-exist.png)
          ```
          MDX
          if node .github/scripts/validate-doc-images.mjs "$root"; then
            echo "Missing component image was not detected"
            exit 1
          fi
          touch "$root/images/actual.png"
          node .github/scripts/validate-doc-images.mjs "$root"
          cat > "$root/duplicate.mdx" <<'MDX'
          ![shot][shot]

          [shot]: /images/missing.png
          [shot]: /images/actual.png
          MDX
          if node .github/scripts/validate-doc-images.mjs "$root"; then
            echo "Duplicate reference incorrectly used last definition"
            exit 1
          fi
          rm "$root/duplicate.mdx"
          cat > "$root/directory.mdx" <<'MDX'
          ![shot](/images)
          MDX
          if node .github/scripts/validate-doc-images.mjs "$root"; then
            echo "Directory incorrectly accepted as an image"
            exit 1
          fi
          rm "$root/directory.mdx"
          node .github/scripts/validate-doc-images.mjs "$root"
      - name: Verify local Markdown and MDX images
        run: node .github/scripts/validate-doc-images.mjs docs
