name: Validate Mintlify documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/mintlify-docs-validate.yml"
  push:
    branches: [main, docs-live]
    paths:
      - "docs/**"
      - ".github/workflows/mintlify-docs-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Mintlify site validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install Mintlify CLI
        run: npm install --global mint@latest
      - name: Validate docs.json and MDX
        working-directory: docs
        run: mint validate
      - name: Check documentation links
        working-directory: docs
        run: mint broken-links
      - name: Verify local Markdown images
        working-directory: docs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys
          from urllib.parse import unquote, urlsplit

          root = Path.cwd().resolve()
          missing = []
          # This guard checks Markdown image syntax, not JSX <img> tags,
          # imported assets, or dynamically generated paths.
          image_pattern = re.compile(r'!\[[^\]]*\]\(\s*<?([^\s)>]+)>?(?:\s+["\x27][^\n]*?["\x27])?\s*\)')

          for page in sorted((*root.rglob("*.md"), *root.rglob("*.mdx"))):
              for match in image_pattern.finditer(page.read_text(encoding="utf-8")):
                  src = match.group(1)
                  parsed = urlsplit(src)
                  if parsed.scheme or parsed.netloc or src.startswith("#"):
                      continue
                  path = unquote(parsed.path)
                  if not path:
                      continue
                  target = (root / path.lstrip("/") if path.startswith("/")
                            else page.parent / path).resolve()
                  if not target.is_relative_to(root) or not target.is_file():
                      missing.append(f"{page.relative_to(root)}: {src}")

          if missing:
              for reference in missing:
                  print(f"Missing local documentation image: {reference}")
              sys.exit(1)
          print("All local Markdown image references exist")
          PY
