name: Exact-SHA mutation comparison
on:
  pull_request:
    branches: [main]
    types: [labeled]
permissions:
  contents: read
concurrency:
  group: mutation-equivalence-129
  cancel-in-progress: true
jobs:
  comparison:
    if: github.event.pull_request.number == 129 && github.event.label.name == 'mutation-comparison'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 70fb812bb4fccf74a41d075fd1bdd1c6cc2aee7e
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements_test.txt
      - name: Clean unsharded exact-SHA comparison
        run: |
          rm -rf mutants
          mutmut run
          mutmut export-cicd-stats
          python -c 'from scripts.mutation_shards import environment, write_json; from pathlib import Path; write_json(Path("unsharded-environment.json"), environment())'
          python scripts/check_mutation_score.py
      - name: Preserve exact-SHA comparison diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-sha-unsharded-comparison
          path: |
            mutants/mutmut-cicd-stats.json
            unsharded-environment.json
          if-no-files-found: error
