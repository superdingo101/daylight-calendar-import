name: Exact-SHA mutation comparison
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  comparison:
    if: github.event.pull_request.number == 129
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 4162f0bdd5c88cda0aeccd0301f53547b34d654f
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - name: Clean unsharded exact-SHA comparison
        run: |
          rm -rf mutants
          mutmut run
          mutmut export-cicd-stats
          python scripts/check_mutation_score.py
      - name: Preserve exact-SHA comparison diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-sha-unsharded-comparison
          path: mutants/mutmut-cicd-stats.json
          if-no-files-found: error
