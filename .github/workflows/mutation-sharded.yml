name: Comprehensive mutation validation

# Cold comprehensive executor shared by PR, nightly and release validation.
on:
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string
      compare_unsharded:
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Optional exact SHA to validate; otherwise use selected ref"
        required: false
        type: string
      compare_unsharded:
        description: "Also run a cold unsharded engine and enforce exact-SHA/environment equivalence"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: comprehensive-mutation-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  plan:
    name: Full mutation partition
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
      compare_unsharded: ${{ steps.target.outputs.compare }}
      execution_image: ${{ steps.target.outputs.image }}
    steps:
      - name: Resolve immutable target
        id: target
        env:
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
          COMPARE: ${{ inputs.compare_unsharded }}
          EXECUTION_IMAGE: python:3.14.8-bookworm@sha256:7ee7e4d4fb42c3ad45b8fdc473b64ec69c3cf6e80ae5d52f6fa55f77fac29027
        run: |
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Target must be an exact commit SHA"
            exit 1
          fi
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "compare=$COMPARE" >> "$GITHUB_OUTPUT"
          echo "image=$EXECUTION_IMAGE" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.target.outputs.sha }}
      - name: Generate deterministic manifest for exact commit
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: python3 -m scripts.mutation_shards plan --sha "$TARGET_SHA" --count 8
      - uses: actions/upload-artifact@v4
        with:
          name: mutation-shard-manifest
          path: mutation-shards/manifest.json
          if-no-files-found: error
          overwrite: true

  shards:
    needs: plan
    name: Clean mutmut shard ${{ matrix.index }}
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.plan.outputs.execution_image }}
    env:
      MUTATION_EXECUTION_IMAGE: ${{ needs.plan.outputs.execution_image }}
    # The init module is split into five exact-mutant jobs below.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        index: [0, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.target_sha }}
      - name: Trust the checked-out workspace inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/download-artifact@v4
        with:
          name: mutation-shard-manifest
          path: mutation-shards
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements_test.txt
      - name: Prepare exact shard (no cached mutant verdicts)
        env:
          SHARD_INDEX: ${{ matrix.index }}
        run: |
          rm -rf mutants
          python -m scripts.mutation_shards prepare --index "$SHARD_INDEX"
      - name: Run complete clean shard and record results
        env:
          SHARD_INDEX: ${{ matrix.index }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'python scripts/pr_mutation.py restore' EXIT
          started=$SECONDS
          mutmut run
          mutmut export-cicd-stats
          python scripts/pr_mutation.py restore
          python -m scripts.mutation_shards record \
            --index "$SHARD_INDEX" \
            --out "mutation-shards/results/shard-$SHARD_INDEX.json" \
            --seconds "$((SECONDS-started))"
          trap - EXIT
      - name: Export shard diagnostics even on failure
        if: always()
        run: |
          mutmut export-cicd-stats
          python scripts/export_mutation_survivors.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-shard-diagnostics-${{ matrix.index }}
          path: |
            mutants/mutmut-cicd-stats.json
            mutation-survivors.txt
            mutation-survivor-names.txt
            mutation-survivor-report.txt
          if-no-files-found: warn
          overwrite: true
          retention-days: 14
      - name: Upload shard result only after full run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-shard-result-${{ matrix.index }}
          path: mutation-shards/results/shard-${{ matrix.index }}.json
          if-no-files-found: warn
          retention-days: 14
          overwrite: true


  split_catalog:
    needs: plan
    name: Discover exact init mutant population
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.plan.outputs.execution_image }}
    env:
      MUTATION_EXECUTION_IMAGE: ${{ needs.plan.outputs.execution_image }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.target_sha }}
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/download-artifact@v4
        with:
          name: mutation-shard-manifest
          path: mutation-shards
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements_test.txt
      - name: Generate fresh init mutant identities with a single-mutant probe
        run: |
          set -euo pipefail
          trap 'python scripts/pr_mutation.py restore' EXIT
          rm -rf mutants
          python -m scripts.mutation_shards prepare --index 1
          mutmut run custom_components.daylight_calendar_import.x_async_setup_entry__mutmut_1
          python scripts/pr_mutation.py restore
          python -m scripts.mutation_split catalog
          trap - EXIT
      - uses: actions/upload-artifact@v4
        with:
          name: mutation-split-catalog
          path: mutation-shards/split-catalog.json
          if-no-files-found: error

  split_shards:
    needs: [plan, split_catalog]
    name: Clean init mutant part ${{ matrix.part }}
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.plan.outputs.execution_image }}
    env:
      MUTATION_EXECUTION_IMAGE: ${{ needs.plan.outputs.execution_image }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.target_sha }}
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/download-artifact@v4
        with:
          name: mutation-shard-manifest
          path: mutation-shards
      - uses: actions/download-artifact@v4
        with:
          name: mutation-split-catalog
          path: mutation-shards
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements_test.txt
      - name: Execute clean exact-mutant partition
        env:
          SPLIT_PART: ${{ matrix.part }}
        run: |
          set -euo pipefail
          trap 'python scripts/pr_mutation.py restore' EXIT
          rm -rf mutants
          python -m scripts.mutation_shards prepare --index 1
          started=$SECONDS
          python -m scripts.mutation_split run --part "$SPLIT_PART"
          python scripts/pr_mutation.py restore
          python -m scripts.mutation_split record --part "$SPLIT_PART" --seconds "$((SECONDS-started))"
          trap - EXIT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-split-result-${{ matrix.part }}
          path: mutation-shards/split-results/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-split-diagnostics-${{ matrix.part }}
          path: |
            mutation-survivors.txt
            mutation-survivor-names.txt
            mutation-survivor-report.txt
          if-no-files-found: warn

  split_combine:
    needs: [plan, split_shards]
    if: ${{ always() && needs.plan.result == 'success' }}
    name: Verify and combine init partitions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require all exact-mutant workers
        env:
          SPLIT_RESULT: ${{ needs.split_shards.result }}
        run: test "$SPLIT_RESULT" = success
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.target_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: mutation-shard-manifest
          path: mutation-shards
      - uses: actions/download-artifact@v4
        with:
          name: mutation-split-catalog
          path: mutation-shards
      - uses: actions/download-artifact@v4
        with:
          pattern: mutation-split-result-*
          path: mutation-shards/split-results
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: mutation-split-diagnostics-*
          path: split-diagnostics
      - name: Fail closed on full split population and scored identities
        run: |
          python3 -m scripts.mutation_split combine
          python3 -m scripts.mutation_split join-diagnostics
      - uses: actions/upload-artifact@v4
        with:
          name: mutation-shard-result-1
          path: mutation-shards/results/shard-1.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: mutation-shard-diagnostics-1
          path: shard-diagnostics/mutation-shard-diagnostics-1/
          if-no-files-found: error

  aggregate:
    if: ${{ always() && needs.plan.result == 'success' }}
    needs: [plan, shards, split_combine]
    name: Validate complete mutation score
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.target_sha }}
      - name: Require all clean shards to succeed
        env:
          SHARD_RESULT: ${{ needs.shards.result }}
          SPLIT_RESULT: ${{ needs.split_combine.result }}
        run: |
          if [[ "$SPLIT_RESULT" != success ]]; then
            echo "::error::Init mutation split failed: $SPLIT_RESULT"
            exit 1
          fi
          if [[ "$SHARD_RESULT" != success ]]; then
            echo "::error::A clean shard failed, timed out or was cancelled: $SHARD_RESULT"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: mutation-shard-manifest
          path: mutation-shards
      - uses: actions/download-artifact@v4
        with:
          pattern: mutation-shard-result-*
          path: mutation-shards/results
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: mutation-shard-diagnostics-*
          path: shard-diagnostics
      - name: Combine all survivor diagnostics
        run: python3 -m scripts.mutation_shards join-diagnostics
      - name: Verify shard identities, completeness and global mutation score
        run: |
          python3 -m scripts.mutation_shards reduce
          python3 scripts/check_mutation_score.py
      - name: Upload verified full-project evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-sharded-aggregate
          path: |
            mutation-shards/aggregate.json
            mutation-shards/manifest.json
            mutation-shards/results/
            mutation-survivors.txt
            mutation-survivor-names.txt
            mutation-survivor-report.txt
            mutants/mutmut-cicd-stats.json
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

  unsharded:
    needs: plan
    if: needs.plan.outputs.compare_unsharded == 'true'
    name: Clean unsharded comparison engine
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.plan.outputs.execution_image }}
    env:
      MUTATION_EXECUTION_IMAGE: ${{ needs.plan.outputs.execution_image }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.target_sha }}
      - name: Trust the checked-out workspace inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/download-artifact@v4
        with:
          name: mutation-shard-manifest
          path: mutation-shards
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements_test.txt
      - name: Execute clean complete engine and record equivalent evidence
        run: |
          set -euo pipefail
          rm -rf mutants
          started=$SECONDS
          mutmut run
          mutmut export-cicd-stats
          python -m scripts.mutation_shards record-unsharded --seconds "$((SECONDS-started))"
          python scripts/check_mutation_score.py
      - name: Preserve unsharded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-unsharded-evidence
          path: mutation-shards/unsharded.json
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

  equivalence:
    if: ${{ always() && needs.plan.outputs.compare_unsharded == 'true' }}
    needs: [plan, aggregate, unsharded]
    name: Enforce exact-SHA engine equivalence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both engines to complete successfully
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          SHARDED_RESULT: ${{ needs.aggregate.result }}
          UNSHARDED_RESULT: ${{ needs.unsharded.result }}
        run: |
          test "$PLAN_RESULT" = success
          test "$SHARDED_RESULT" = success
          test "$UNSHARDED_RESULT" = success
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.target_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: mutation-shard-manifest
          path: mutation-shards
      - uses: actions/download-artifact@v4
        with:
          name: mutation-sharded-aggregate
      - uses: actions/download-artifact@v4
        with:
          name: mutation-unsharded-evidence
          path: mutation-shards
      - name: Fail closed on SHA, environment, population or score disagreement
        run: python3 -m scripts.mutation_shards compare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-engine-equivalence
          path: mutation-shards/equivalence.json
          if-no-files-found: warn
          retention-days: 14
          overwrite: true
