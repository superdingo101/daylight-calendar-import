name: Update Integration Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to write, for example v0.5.4 or v0.6.0-beta0"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Validate requested version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$REQUESTED_VERSION"

          if ! echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            echo "ERROR: Version must look like v1.2.3 or v1.2.3-beta0"
            exit 1
          fi

          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q "$VERSION"; then
            echo "ERROR: Tag $VERSION already exists"
            exit 1
          fi

          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Update integration version sources
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]

          manifest_path = Path("custom_components/daylight_calendar_import/manifest.json")
          manifest = json.loads(manifest_path.read_text())
          manifest["version"] = version
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")

          pyproject_path = Path("pyproject.toml")
          pyproject = pyproject_path.read_text()
          updated, count = re.subn(
              r'(?m)^(version\s*=\s*)"[^"]+"\s*$',
              rf'\1"{version}"',
              pyproject,
              count=1,
          )
          if count != 1:
              raise SystemExit("ERROR: Expected exactly one project version in pyproject.toml")
          pyproject_path.write_text(updated)
          PY

      - name: Verify synchronized versions
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          expected = os.environ["EXPECTED_VERSION"]
          manifest = json.loads(
              Path("custom_components/daylight_calendar_import/manifest.json").read_text()
          )
          pyproject = Path("pyproject.toml").read_text()
          match = re.search(r'(?m)^version\s*=\s*"([^"]+)"\s*$', pyproject)

          manifest_version = manifest.get("version")
          pyproject_version = match.group(1) if match else None

          print(f"Manifest version: {manifest_version}")
          print(f"pyproject version: {pyproject_version}")

          if manifest_version != expected or pyproject_version != expected:
              raise SystemExit("ERROR: Release version sources are not synchronized")
          PY

      - name: Create release prep pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: release-prep/${{ steps.version.outputs.tag }}
          base: main
          delete-branch: true
          title: Prepare release ${{ steps.version.outputs.tag }}
          commit-message: Prepare release ${{ steps.version.outputs.tag }}
          body: |
            Updates the Daylight Calendar Import release version to `${{ steps.version.outputs.version }}`.

            The workflow updates and verifies both:
            - `custom_components/daylight_calendar_import/manifest.json`
            - `pyproject.toml`

            Merge only after the normal test, HACS, Hassfest, review, and release gates are green.
          add-paths: |
            custom_components/daylight_calendar_import/manifest.json
            pyproject.toml
