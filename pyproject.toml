[project]
name = "daylight-calendar-import"
version = "0.9.0"
description = "Home Assistant integration for extracting calendar events from unstructured input"
requires-python = ">=3.14.2"
license = "MIT"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["custom_components.daylight_calendar_import"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.mutmut]
source_paths = ["custom_components/daylight_calendar_import/"]
pytest_add_cli_args_test_selection = ["tests/"]
# Test collection runs inside mutants/. Copy entire directory trees because
# mutmut 3.8.0 does not mkdir parents when also_copy targets a single file.
# The tagged-docs publication regression test reads docs/docs.json and its
# authored release pages, so both must exist in the isolated mutants/ tree.
also_copy = ["scripts/", "docs/"]
