<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manual import browser acceptance</title>
<style>body {margin:0; --primary-color:#1976d2; --divider-color:#bbb; --card-background-color:#fff; --primary-text-color:#111}</style>
<body>
<daylight-import-panel></daylight-import-panel>
<script type="module">
import "/frontend/panel.js";
// This is an explicit deterministic HA API boundary. Actual HA service,
// persistence, extraction and no-IMAP registration remain covered in Python.
const event = {id: "event-1", title: "School picnic", start: "2026-10-20T15:00:00+00:00",
  end: "2026-10-20T16:00:00+00:00", all_day: false, status: "pending"};
const pending = {id: "import-1", source_kind: "manual_text", source_title: "Manual source",
  source_text: "School picnic October 20 at 3pm", created_at: "2026-10-15T12:00:00+00:00",
  events: [event], event_count: 1, warnings: [], calendar_entity: "calendar.family"};
window.fixture = {calls: [], imports: [], mode: "success", held: false, release: null,
  pending, submissions: 0, uploads: []};
const fixture = window.fixture;
const panel = document.querySelector("daylight-import-panel");
panel.narrow = matchMedia("(max-width: 480px)").matches;
panel.hass = {
  user: {is_admin: true}, config: {version: "2026.7.4", time_zone: "UTC"},
  locale: {language: "en", time_format: "24"}, states: {},
  // Deliberately no IMAP configuration or email service.
  fetchWithAuth: async (path, options) => {
    const response = await fetch(path, options);
    if (options?.method === "POST" && response.ok) {
      fixture.uploads.push((await response.clone().json()).observed);
    }
    return response;
  },
  callWS: async call => {
    fixture.calls.push(structuredClone(call));
    if (call.service === "list_pending") return {response: {imports: fixture.imports}};
    if (call.service === "get_pending") return {response: {pending: fixture.pending}};
    if (call.service === "list_activity") return {response: {activity: []}};
    if (call.service === "check_pending_event") {
      if (fixture.holdObservation) await new Promise(resolve => {fixture.releaseObservation = resolve;});
      if (fixture.observationError) throw new Error(fixture.observationError);
      return {response: {pending_id: pending.id, event_id: call.service_data.event_id,
        observed_calendars: ["calendar.family", "calendar.work"],
        matches: [{kind: "conflict", calendar_entity: "calendar.work", existing_title: "Dentist"}]}};
    }
    if (call.service === "preview_pending_timezone") {
      if (!fixture.pending.events[0].temporal) throw new Error("Not a timezone test");
      const zone = call.service_data.time_zone;
      const arrival = call.service_data.end_time_zone;
      return {response: {
        pending_id: fixture.pending.id, event_id: call.service_data.event_id,
        needs_end_zone: true,
        suggested_start_zones: ["America/Los_Angeles"],
        suggested_end_zones: ["America/New_York"],
        preview: zone && arrival ? {
          start_zone: zone, end_zone: arrival,
          start_local: "2028-07-10T08:00:00",
          end_local: "2028-07-10T16:30:00",
          start_utc: "2028-07-10T15:00:00+00:00",
          end_utc: "2028-07-10T20:30:00+00:00",
          start_offset: "-0700", end_offset: "-0400",
          start_abbreviation: "PDT", end_abbreviation: "EDT",
          duration_seconds: 19800,
        } : null,
      }};
    }
    if (call.service === "confirm_pending_timezone") {
      const options = call.service_data;
      if (options.time_zone !== "America/Los_Angeles" ||
          options.end_time_zone !== "America/New_York") {
        throw new Error("Different zones were not deliberately selected");
      }
      const original = fixture.pending.events[0];
      const resolved = {
        ...original, start: "2028-07-10T08:00:00-07:00",
        end: "2028-07-10T16:30:00-04:00",
        temporal: {...original.temporal, status: "resolved", source: "user",
          start_zone: options.time_zone, end_zone: options.end_time_zone},
      };
      fixture.pending = {...fixture.pending, events: [resolved]};
      return {response: {pending_id: fixture.pending.id, event: resolved}};
    }
    if (call.service === "approve_pending_event") {
      fixture.imports = [];
      return {response: {pending_id: pending.id, event_id: call.service_data.event_id, approved: true}};
    }
    if (!["submit_text", "submit_image", "submit_pdf"].includes(call.service)) {
      throw new Error(`Unexpected service: ${call.service}`);
    }
    fixture.submissions++;
    if (fixture.held) await new Promise(resolve => { fixture.release = resolve; });
    if (fixture.mode === "failure") throw Object.assign(new Error("AI task provider unavailable"), {code: "home_assistant_error"});
    if (fixture.mode === "disconnect") throw new Error("Connection lost");
    if (fixture.mode === "malformed") return {response: {pending: {}}};
    const duplicate = fixture.mode === "duplicate";
    fixture.imports = duplicate ? [] : [pending];
    return {response: {pending: duplicate ? null : pending, duplicate,
      duplicate_source: duplicate, duplicate_events: 0, warnings: [],
      activity_id: duplicate ? null : pending.id, status: duplicate ? "duplicate" : "pending_review"}};
  },
};
</script>
</body>
</html>
